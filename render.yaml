databases:
  - name: padariadb
    databaseName: padariadb
    user: padaria

services:
  - type: web
    name: padaria-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 8h
      - key: DATABASE_URL
        fromDatabase:
          name: padariadb
          property: connectionString
      - key: FRONTEND_URL
        value: https://padaria-web.onrender.com

  - type: web
    name: padaria-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://padaria-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
