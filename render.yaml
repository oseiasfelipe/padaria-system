databases:
  - name: padariadb
    databaseName: padariadb
    user: padaria
    plan: free

services:
  # ── Backend Node.js ──────────────────────────────────────────────────────
  - type: web
    name: padaria-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 8h
      - key: DATABASE_URL
        fromDatabase:
          name: padariadb
          property: connectionString
      - key: FRONTEND_URL
        value: https://padaria-web.onrender.com   # ajuste após criar o frontend

  # ── Frontend React (Static Site) ─────────────────────────────────────────
  - type: web
    name: padaria-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://padaria-api.onrender.com   # ajuste com a URL real do backend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
